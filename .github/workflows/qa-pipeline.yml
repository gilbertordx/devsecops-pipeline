name: QA Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: docker/go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Build Docker image
        run: docker build -t shadow-api-ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: shadow-api-ci
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH

  terraform-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Scan Terraform with tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  ephemeral-qa-teardown:
    name: Ephemeral QA Teardown
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - terraform-check
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_IN_AUTOMATION: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Provision ephemeral infrastructure
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Capture Terraform outputs
        id: terraform_outputs
        working-directory: terraform
        run: echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build deployment image
        run: docker build -t shadow-api-ci ./docker

      - name: Tag and push Docker image to ECR
        env:
          ECR_REPOSITORY_URL: ${{ steps.terraform_outputs.outputs.ecr_repository_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag shadow-api-ci:latest "$ECR_REPOSITORY_URL:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"

      - name: Simulate QA test suite execution
        env:
          ECR_REPOSITORY_URL: ${{ steps.terraform_outputs.outputs.ecr_repository_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: echo "Simulating QA test suite against $ECR_REPOSITORY_URL:$IMAGE_TAG"

      - name: Destroy ephemeral infrastructure
        if: always()
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false
